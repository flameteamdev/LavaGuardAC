name: LavaGuardAC
version: '1.2'
main: com.flameteam.lavaguard.LavaGuardAC
api-version: '1.21'
authors: [ FlameTeam Studios ]
description: Advanced Anti-Cheat compatible from 1.21.4 up to 26.2
commands:
  lavaguard:
    aliases: [lg, ac]
    description: Główna komenda systemu Lava Guard AC
    permission: lavaguard.admin
permissions:
  lavaguard.admin:
    description: Dostęp do panelu administratora i komend
    default: op
  lavaguard.bypass:
    description: Ignorowanie sprawdzania przez anty-cheat
    default: op
language: "PL"

settings:
  max-violations: 5
  ban-duration-days: 30

discord:
  enabled: false
  webhook-url: "https://discord.com/api/webhooks/TWOJE_ID/TWOJ_TOKEN"

update-checker:
  enabled: true
  modrinth-project: "lavaguardac"

checks:
  fly:
    enabled: true
  speed:
    enabled: true
    max-speed: 0.75
  reach:
    enabled: true
    max-distance: 3.6
  killaura:
    enabled: true
    min-dot-product: 0.55
  hitbox:
    enabled: true
    max-expansion: 0.25
  criticals:
    enabled: true
    min-fall-distance: 0.065
  wallhit:
    enabled: true
    wall-buffer: 0.20
  antikb:
    enabled: true
  nofall:
    enabled: true
  hide-plugins:
    enabled: true # Blokowanie /pl, /plugins, /about, /version
  fastbreak:
    enabled: true
    min-time-ms: 50
  autototem:
    enabled: true
    min-time-ms: 100
  autocrystal:
    enabled: true
    min-time-ms: 50
  autoanchor:
    enabled: true
    min-time-ms: 50
  scaffold:
    enabled: true
    min-pitch: 40.0
    min-place-delay-ms: 65
    max-rotation-snap: 75.0
    max-sprint-bridges: 3

